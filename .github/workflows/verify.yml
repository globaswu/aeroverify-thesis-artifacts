name: Verify release manifest

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify hashes, package scope, and path hygiene
        shell: pwsh
        run: ./tools/verify_manifest.ps1
      - name: Verify self-contained figure folders
        run: python scripts/verify_figure_packages.py
